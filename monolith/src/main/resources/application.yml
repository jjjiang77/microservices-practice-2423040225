server:
  port: 8080

spring:
  application:
    name: shangxiaotao
  datasource:
    # 默认连接本地 MySQL，建库建表脚本见 monolith/sql/schema.sql
    # 可用环境变量 DB_USERNAME / DB_PASSWORD 覆盖
    url: jdbc:mysql://localhost:3306/shangxiaotao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:shangxiaotao}
    password: ${DB_PASSWORD:shangxiaotao}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 表结构由 sql/schema.sql 设计，Hibernate 只补缺失列，不做破坏性变更
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.zjgsu.jby: DEBUG
