server:
  port: 8080

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: PERSONAL_GROUP
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shangxiaotao_product?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:shangxiaotao_product}
    password: ${DB_PASSWORD:shangxiaotao}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  security:
    # 调用 user-service 时携带的网关内部密钥，需与 user-service 配置一致。
    gateway-secret: ${GATEWAY_INTERNAL_SECRET:dev-only-change-me-gateway-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.zjgsu.jby: DEBUG
