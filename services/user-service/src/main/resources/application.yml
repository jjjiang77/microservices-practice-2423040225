server:
  port: 8081

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: PERSONAL_GROUP
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shangxiaotao_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:shangxiaotao_user}
    password: ${DB_PASSWORD:shangxiaotao}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  security:
    # 与网关共享的 JWT 密钥，生产环境必须通过环境变量注入。
    jwt-secret: ${JWT_SECRET:dev-only-change-me-jwt-secret-at-least-32-bytes}
    jwt-ttl-seconds: ${JWT_TTL_SECONDS:3600}
    # 网关转发时附带的内部密钥；直接访问本服务的非公开接口会被拒绝。
    gateway-secret: ${GATEWAY_INTERNAL_SECRET:dev-only-change-me-gateway-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.zjgsu.jby: DEBUG
