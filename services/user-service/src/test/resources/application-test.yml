# 测试专用配置：使用 H2 内存数据库，无需本地 MySQL 即可重复执行测试
spring:
  datasource:
    url: jdbc:h2:mem:shangxiaotao_user;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

logging:
  level:
    root: WARN
    com.zjgsu.jby: INFO

spring.cloud.nacos.discovery.enabled: false
spring.cloud.service-registry.auto-registration.enabled: false
