# 商小淘本地编排：三个业务服务、独立数据库、Nacos
# 用法（一键拉起）：
#   cp .env.example .env          # 首次准备配置模板
#   docker compose up -d --build  # 构建并启动全部容器
#   docker compose ps             # 查看全部服务状态
#   docker compose logs -f        # 查看实时日志
# 一键停止并清理：
#   docker compose down -v        # 停容器+删数据卷（仅开发测试用）
# 不使用已废弃的 version 字段。

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?设置至少32字节随机值的Base64编码}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?设置服务身份key}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?设置服务身份value}
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks: [shangxiaotao]
  # 一个 MySQL 实例承载三个独立业务库，保留原数据卷便于迁移。
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      LEGACY_MYSQL_DATABASE: ${MYSQL_DATABASE:-shangxiaotao}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}}
      PURCHASE_DB_PASSWORD: ${PURCHASE_DB_PASSWORD:-${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database:/opt/shangxiaotao-db:ro
      - ./database/bootstrap.sh:/docker-entrypoint-initdb.d/01-bootstrap.sh:ro
    healthcheck:
      # 真实服务器就绪后 mysqladmin ping 才返回成功；init 阶段的临时实例不会导致误判
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [shangxiaotao]

  # ---- 服务1：product-service（原 monolith 改造，商品域，端口 8080）----
  product-service: &product-service
    build:
      context: ./services/product-service
    image: product-service:week06
    # 等数据库 + user-service 都就绪再启动，避免先起连不上库/调不通用户服务
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_started
      nacos:
        condition: service_started
    environment:
      # 用 compose 服务名 mysql 连接，不使用 localhost
      DB_URL: jdbc:mysql://mysql:3306/shangxiaotao_product?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
      SERVER_TOMCAT_BASEDIR: /tmp/product-tomcat
      DB_USERNAME: shangxiaotao_product
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}}
      # 通过 Nacos 获取用户服务实例地址
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?设置 Nacos 初始化后的密码}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [shangxiaotao]

  product-service-replica:
    <<: *product-service
    ports: []

  # ---- 服务2：user-service（新建，用户域，端口 8081）----
  user-service:
    build:
      context: ./services/user-service
    image: user-service:week06
    # 仅等数据库健康（user-service 不依赖其他微服务）
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/shangxiaotao_user?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: shangxiaotao_user
      DB_PASSWORD: ${USER_DB_PASSWORD:-${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?设置 Nacos 初始化后的密码}
    ports:
      - "127.0.0.1:8081:8081"
    networks: [shangxiaotao]

  purchase-service:
    build:
      context: ./services/purchase-service
    image: purchase-service:week08
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/shangxiaotao_purchase?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: shangxiaotao_purchase
      DB_PASSWORD: ${PURCHASE_DB_PASSWORD:-${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?设置 Nacos 初始化后的密码}
    ports:
      - "127.0.0.1:8083:8083"
    networks: [shangxiaotao]

volumes:
  nacos-data:
  nacos-logs:
  mysql-data:

networks:
  shangxiaotao:
